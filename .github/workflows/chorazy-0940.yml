name: "0.9.40 Chorazy 3/5 - 1000 audited replays and paired balance"

on:
  push:
    branches: [feature/0940-chorazy-3x5-versioned, main]
    paths:
      - game/core/**
      - game/ui/**
      - tools/balance_ab.py
      - tools/simulate_v22.py
      - tests/test_chorazy_0940.py
      - .github/workflows/chorazy-0940.yml
  pull_request:
    paths:
      - game/core/**
      - game/ui/**
      - tools/balance_ab.py
      - tools/simulate_v22.py
      - tests/test_chorazy_0940.py
      - .github/workflows/chorazy-0940.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-replays:
    name: ${{ matrix.case_name }} -- verify every replay
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case_name: normal-vs-normal, seed: 39000, games: 400, level0: normalny, level1: normalny}
          - {case_name: easy-vs-hard, seed: 49000, games: 300, level0: łatwy, level1: trudny}
          - {case_name: hard-vs-easy, seed: 59000, games: 300, level0: trudny, level1: łatwy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Simulate all seeded games with individually verified SHA-256 replay
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          python tools/simulate_v22.py \
            --games ${{ matrix.games }} \
            --start-seed ${{ matrix.seed }} \
            --max-steps 3000 \
            --level-0 ${{ matrix.level0 }} \
            --level-1 ${{ matrix.level1 }} \
            --starting-compensation unit_3_5 \
            --verify-every 1 \
            --output-dir reports/chorazy_${{ matrix.case_name }}
      - name: Assert all matches complete and every replay verified
        env:
          CASE: ${{ matrix.case_name }}
          GAMES: ${{ matrix.games }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          fp=Path("reports/chorazy_"+os.environ["CASE"]+"/raport_100_meczow.json")
          data=json.loads(fp.read_text(encoding="utf-8"))
          s=data["summary"]
          assert s["finished"]==int(os.environ["GAMES"]) and s["failed"]==0,s
          assert s["audit_replays_verified"]==int(os.environ["GAMES"]),s
          assert data["configuration"]["starting_compensation"]=="unit_3_5",data["configuration"]
          print("PASS",os.environ["CASE"],s["finished"],"complete signed replays")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chorazy0940-${{ matrix.case_name }}
          path: |
            reports/chorazy_${{ matrix.case_name }}/raport_100_meczow.json
            reports/chorazy_${{ matrix.case_name }}/wyniki_meczow.csv
            reports/chorazy_${{ matrix.case_name }}/failures/*.json
          if-no-files-found: warn
          retention-days: 30

  paired-balance:
    name: Paired first-seat balance (coins vs 5/5 vs 3/5)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compare 400 identical seeds per compensation mode
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          python tools/balance_ab.py --games 400 --start-seed 39000 \
            --level-0 normalny --level-1 normalny \
            --output reports/chorazy/balance_ab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chorazy0940-Paired-Balance-400
          path: reports/chorazy/balance_ab.*
          if-no-files-found: warn
          retention-days: 90
