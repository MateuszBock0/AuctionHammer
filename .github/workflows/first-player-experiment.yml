name: AuctionHammer - first player advantage v22

on:
  pull_request:
    paths:
      - 'tools/analyze_first_player_advantage.py'
      - 'tests/test_first_player_advantage_v22.py'
      - '.github/workflows/first-player-experiment.yml'
      - 'game/core/ai.py'
      - 'game/core/engine.py'
  push:
    branches: [main]
    paths:
      - 'tools/analyze_first_player_advantage.py'
      - 'tests/test_first_player_advantage_v22.py'
      - '.github/workflows/first-player-experiment.yml'
      - 'game/core/ai.py'
      - 'game/core/engine.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: A/B paired random seeds: 200 x 5 bonuses x 3 AI profiles
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/analyze_first_player_advantage.py \
            --games-per-scenario 200 \
            --start-seed 220000 \
            --max-steps 3000 \
            --bonuses 0 3 5 7 10 \
            --output-dir reports/first_player_v22
      - name: Publish study even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-V22-First-Player-Study
          path: reports/first_player_v22/
          if-no-files-found: warn
          retention-days: 90
