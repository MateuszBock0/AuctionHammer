name: Build portable Windows + Release
on:
  push:
    branches: [main, feature/0943-quality-release-safe-launcher]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: auctionhammer-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  linux-regressions:
    name: Release gate / Linux regression + 20 signed games
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check version and every public README link
        run: python -m tools.release_meta check
      - name: Complete Linux regression suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Real Pygame UI render
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/render_minimal_fantasy_preview.py
      - name: 20 full fixed-board matches, verify each signed replay
        env:
          PYTHONUTF8: '1'
        run: python -m tools.check_fixed_board_0951 --games 20
      - name: Validate descriptions of all 121 card variants
        run: |
          python -m scripts.card_copy_matrix_0949 > card-copy-121.csv
          python -c "import csv; assert len(list(csv.DictReader(open('card-copy-121.csv',encoding='utf-8'))))==121"

  forensic-100:
    name: Release gate / 100 fresh matches and 100 signed replays
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Full independent 100-match forensic run
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/simulate_v22.py --games 100 --start-seed 230000 \
            --max-steps 3000 --verify-every 1 \
            --level-0 normalny --level-1 normalny \
            --output-dir reports/release_forensic_100
      - name: Strict signed 100-match report gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('reports/release_forensic_100')
          r=json.loads((root/'raport_100_meczow.json').read_text(encoding='utf-8'))
          summary=r['summary']
          assert summary['finished']==100 and summary['failed']==0,summary
          assert summary['audit_replays_verified']==100,summary
          assert all(row['status']=='finished' and row['replay_verified']
                     and row['failed_commands']==0 for row in r['matches'])
          assert len(list((root/'historia_meczow').glob('mecz_*.json.gz')))==100
          print('PASS: 100 complete signed histories, 100 full replays')
          PY

  signed-cohorts:
    name: Release gate / ${{ matrix.label }} full signed replays
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: normal-normal, games: 400, seed: 39000, level0: normalny, level1: normalny}
          - {label: easy-hard, games: 300, seed: 49000, level0: łatwy, level1: trudny}
          - {label: hard-easy, games: 300, seed: 59000, level0: trudny, level1: łatwy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: 1000-game audit cohorts / each game independently replayed
        env:
          PYTHONUTF8: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/simulate_v22.py --games ${{ matrix.games }} \
            --start-seed ${{ matrix.seed }} --max-steps 3000 \
            --level-0 ${{ matrix.level0 }} --level-1 ${{ matrix.level1 }} \
            --starting-compensation choice_2_5_or_coins --verify-every 1 \
            --output-dir reports/release_${{ matrix.label }}
      - name: Exact per-cohort completion and replay gate
        env:
          LABEL: ${{ matrix.label }}
          COUNT: ${{ matrix.games }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path('reports/release_'+os.environ['LABEL'])/
                        'raport_100_meczow.json').read_text(encoding='utf-8'))
          summary=r['summary']
          n=int(os.environ['COUNT'])
          assert summary['finished']==n and summary['failed']==0,summary
          assert summary['audit_replays_verified']==n,summary
          assert all(row['replay_verified'] and row['failed_commands']==0
                     for row in r['matches'])
          print('PASS:',n,'complete signed replays',os.environ['LABEL'])
          PY

  windows:
    name: Package Windows only after ALL independent release gates PASS
    needs: [linux-regressions, forensic-100, signed-cohorts]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Validate release version, public README links and changelog
        run: python -m tools.release_meta check
      - name: Generate exact GitHub Release notes from current CHANGELOG section
        run: python -m tools.release_meta notes --output release-notes.md
      - name: Automated regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Final Windows readiness - launch, mouse clicks, previews, save/load
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -p test_windows_readiness_09104.py -v
      - name: Test verified SHA256 updater and atomic rollback on Windows PowerShell 5.1
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE/tests/windows/test_portable_launcher_0943.ps1"
      - name: Render Minimal Fantasy screenshots
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/render_minimal_fantasy_preview.py
      - name: Publish card screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-Minimal-Fantasy-Preview
          path: preview/*.png
      - name: Stamp exact GitHub build commit for match audits
        shell: pwsh
        run: |
          $mvp = (Get-Content VERSION.json -Raw | ConvertFrom-Json).mvp
          $info = @{ commit = '${{ github.sha }}'; version = $mvp } | ConvertTo-Json -Compress
          Set-Content -Path 'data/BUILD_INFO.json' -Value $info -Encoding utf8
      - name: Verify stamped audit build matches the release commit
        shell: pwsh
        run: |
          python -c "from game.core.build_info import build_identity; x=build_identity(); assert x['source']=='embedded-ci' and x['commit']=='${{ github.sha }}', x"
      - name: Build AuctionHammer.exe with Python and pygame-ce included
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AuctionHammer --paths . --icon "assets/branding/chorazy_zawsze_zdazy.ico" --add-data "data;data" --add-data "assets;assets" --collect-all pygame game/main.py
      - name: Assemble standalone master folder
        shell: pwsh
        run: |
          $dest = 'release/AuctionHammer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path 'dist/AuctionHammer/*' -Destination $dest -Recurse -Force
          foreach ($dir in @('game','assets','data','docs','tests','tools','preview','.vscode')) {
            Copy-Item -Path $dir -Destination $dest -Recurse -Force
          }
          foreach ($f in @('AUCTIONHAMMER_MASTER.md','README.md','CHANGELOG.md','CONTRIBUTING.md','LICENSE','VERSION.json','requirements.txt','URUCHOM_AUCTIONHAMMER.bat','GRAJ_BEZ_INTERNETU.bat','COFNIJ_AKTUALIZACJE.bat','OPUBLIKUJ_NA_GITHUB.bat','OTWORZ_W_VS_CODE.bat','START_DEVELOPER.bat')) {
            Copy-Item -Path $f -Destination $dest -Force
          }
          # Ship a tracked, permitted album once, beside the portable EXE.
          $soundtrack = 'assets/music/music_auctionhammer.mp3'
          if (Test-Path -LiteralPath $soundtrack) {
            $releaseTrack = Join-Path $dest $soundtrack
            if (-not (Test-Path -LiteralPath $releaseTrack)) {
              throw 'Licensed soundtrack is tracked but missing from Windows release.'
            }
            # PyInstaller --add-data also creates an unused duplicate under _internal.
            $internalTrack = Join-Path $dest '_internal/assets/music/music_auctionhammer.mp3'
            if (Test-Path -LiteralPath $internalTrack) {
              Remove-Item -LiteralPath $internalTrack -Force
            }
          }
          $tag = 'build-' + '${{ github.sha }}'.Substring(0, 8)
          Set-Content -Path "$dest/BUILD_VERSION.txt" -Value $tag -NoNewline
          Compress-Archive -Path $dest -DestinationPath 'AuctionHammer-Windows.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'AuctionHammer-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'AuctionHammer-Windows.zip.sha256'), ($hash + ' *AuctionHammer-Windows.zip'), [Text.Encoding]::ASCII)
          Write-Host ('SHA256 ' + $hash)
      - name: Verify REAL packaged README links and required release docs in folder AND ZIP
        run: python -m tools.release_package --folder release/AuctionHammer --zip AuctionHammer-Windows.zip
      - name: Verify archive and checksum on Windows
        shell: powershell
        run: |
          $sum = ((Get-Content -Raw 'AuctionHammer-Windows.zip.sha256').Trim() -split '\s+')[0]
          $actual = (Get-FileHash 'AuctionHammer-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sum -ne $actual) {throw 'Published checksum mismatch'}
          $check = 'release/AuctionHammer'
          foreach ($p in @('AuctionHammer.exe','_internal','BUILD_VERSION.txt','VERSION.json','tools/portable_launcher.ps1','URUCHOM_AUCTIONHAMMER.bat')) {
            if (-not (Test-Path -LiteralPath (Join-Path $check $p))) { throw ('Release missing: ' + $p) }
          }
      - name: Test installing the REAL packaged Windows ZIP through the portable launcher
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AuctionHammer-release-smoke'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = (Resolve-Path 'AuctionHammer-Windows.zip').Path
          $sum = (Resolve-Path 'AuctionHammer-Windows.zip.sha256').Path
          $tag = 'build-' + '${{ github.sha }}'.Substring(0, 8)
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'tools/portable_launcher.ps1' -ProjectRoot $root -PackagePath $zip -ChecksumPath $sum -VersionTag $tag -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Real ZIP installer smoke test failed' }
          $active = (Get-Content -LiteralPath (Join-Path $root 'ACTIVE_RELEASE.txt') -Raw).Trim()
          if ($active -ne $tag) { throw ('Wrong active release: ' + $active) }
          $installed = Join-Path (Join-Path (Join-Path $root '.auctionhammer-versions') $tag) 'AuctionHammer.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw 'Installed EXE missing' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'tools/portable_launcher.ps1' -ProjectRoot $root -SkipUpdate -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Offline launcher smoke test failed' }
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-Windows
          path: |
            AuctionHammer-Windows.zip
            AuctionHammer-Windows.zip.sha256
      - name: Publish stable latest-release download URL
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-' + '${{ github.sha }}'.Substring(0, 8)
          # Read the actual version from the exact packaged commit. Do not
          # leave an obsolete hard-coded 0.9.43 in future release notes.
          $version = (Get-Content -LiteralPath 'VERSION.json' -Raw | ConvertFrom-Json).mvp
          if ([string]::IsNullOrWhiteSpace([string]$version)) {
            throw 'Invalid app version in VERSION.json'
          }
          # Release notes are sourced from the verified VERSION.json release
          # heading in CHANGELOG.md. Never publish stale hard-coded notes.
          gh release create $tag 'AuctionHammer-Windows.zip' 'AuctionHammer-Windows.zip.sha256' --title "AuctionHammer $version Portable $tag" --notes-file 'release-notes.md' --latest --target '${{ github.sha }}'
