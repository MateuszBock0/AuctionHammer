name: AuctionHammer 0.9.34 - 100 fresh forensic matches

on:
  pull_request:
    paths:
      - '.github/workflows/v22-postfix-100-forensic.yml'
      - 'docs/QA_0934_POSTFIX_100.md'
      - 'game/core/**'
      - 'game/ui/**'
      - 'tools/simulate_v22.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-full-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: All automated unit/regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Independent cohort of 100 REAL audited v22 games - replay EVERY game
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/simulate_v22.py \
            --games 100 \
            --start-seed 230000 \
            --max-steps 3000 \
            --verify-every 1 \
            --level-0 normalny \
            --level-1 normalny \
            --output-dir reports/v22_forensic_0934_100
      - name: Verify cohort and FULL archived replay coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('reports/v22_forensic_0934_100')
          report=json.loads((root/'raport_100_meczow.json').read_text(encoding='utf-8'))
          summary=report['summary']
          assert (report['configuration']['start_seed'], report['configuration']['last_seed'])==(230000,230099)
          assert report['configuration']['replay_every']==1
          assert summary['finished']==100 and summary['failed']==0, summary
          assert summary['audit_replays_verified']==100, summary
          assert sorted(row['seed'] for row in report['matches'])==list(range(230000,230100))
          assert all(row['status']=='finished' and row['replay_verified'] and row['failed_commands']==0 for row in report['matches'])
          archived=list((root/'historia_meczow').glob('mecz_*.json.gz'))
          assert len(archived)==100,len(archived)
          print('PASS: 100 distinct fresh matches; 100 full command replays; 0 rejected commands; 100 gzipped audited histories')
          PY
      - name: Upload raw audits and failure traces even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-0934-Forensic100-All-Replays
          path: reports/v22_forensic_0934_100/
          if-no-files-found: warn
          retention-days: 90
