name: AuctionHammer - wstepna proba balansu v22

on:
  pull_request:
    paths:
      - '.github/workflows/first-player-preview.yml'

permissions:
  contents: read

jobs:
  quick-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Preliminary sample 30 seeds in 15 scenarios
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/analyze_first_player_advantage.py \
            --games-per-scenario 30 \
            --start-seed 220000 \
            --output-dir reports/first_player_preview
      - name: Preliminary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-First-Player-Preview
          path: reports/first_player_preview/
          if-no-files-found: warn
