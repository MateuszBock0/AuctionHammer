name: AuctionHammer - testy
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalacja bibliotek
        run: python -m pip install -r requirements.txt
      - name: Testy jednostkowe
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Rzeczywisty render Pygame wszystkich ikon i ekranów
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/render_minimal_fantasy_preview.py
      - name: Artefakty podglądów na PR
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-Game-Experience-Preview
          path: preview/*.png
