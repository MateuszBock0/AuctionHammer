name: AuctionHammer - testy
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalacja bibliotek
        run: python -m pip install -r requirements.txt
      - name: Validate public version, changelog and README paths
        run: python -m tools.release_meta check
      - name: Testy jednostkowe
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Symulacja inteligentnych aukcji — 128 pełnych meczów, wspólne seedy, zamiana miejsc
        run: python -m tools.simulate_smart_auction_0990 --pairs 32 --output reports/auction-ai-0990.json --min-stronger-winrate 0.50
      - name: Raport empirycznych pojedynków AI
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-0990-Smart-Auction-AI
          path: reports/auction-ai-0990.json
      - name: Test porównawczy taktycznego AI — 64 pełne mecze, lustrzane seedy
        run: python -m tools.simulate_hard_tactics_0993 --pairs 32 --output reports/hard-tactics-0993.json --min-winrate 0.50
      - name: Raport silniejsze AI kontra dawna polityka wyboru celu
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-0993-Hard-Tactics
          path: reports/hard-tactics-0993.json
      - name: Rzeczywisty render Pygame wszystkich ikon i ekranów
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/render_minimal_fantasy_preview.py
      - name: Test 20 pełnych partii na stałych polach i podpisanych audytów
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUTF8: '1'
        run: python -m tools.check_fixed_board_0951 --games 20
      - name: Generuj indeks opisów 70 kart i 51 wariantów
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p reports
          python -m scripts.card_copy_matrix_0949 > reports/card-copy-coverage-121.csv
          python -c "import csv; x=list(csv.DictReader(open('reports/card-copy-coverage-121.csv',encoding='utf-8'))); assert len(x)==121, len(x)"
      - name: Udostępnij audyt opisów na każdym PR
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-Card-Copy-Coverage-121
          path: reports/card-copy-coverage-121.csv
      - name: Artefakty podglądów na PR
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-Game-Experience-Preview
          path: preview/*.png
