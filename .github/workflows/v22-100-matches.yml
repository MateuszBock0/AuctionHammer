name: AuctionHammer - 100 meczow v22 z audytami

on:
  pull_request:
    paths:
      - 'tools/simulate_v22.py'
      - 'tests/test_v22_tournament_0933.py'
      - '.github/workflows/v22-100-matches.yml'
      - 'game/core/**'
  push:
    branches: [main]
    paths:
      - 'tools/simulate_v22.py'
      - 'tests/test_v22_tournament_0933.py'
      - '.github/workflows/v22-100-matches.yml'
      - 'game/core/**'
  workflow_dispatch:

jobs:
  tournament:
    name: 100 kompletnych partii AI vs AI (v22)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalacja zaleznosci
        run: python -m pip install -r requirements.txt
      - name: Symulacja i integralnosc kazdej akcji + audyty 100 meczow
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/simulate_v22.py \
            --games 100 \
            --start-seed 220000 \
            --max-steps 3000 \
            --verify-every 10 \
            --output-dir reports/v22_100
      - name: Zapisz raporty i pelne audyty nawet w razie bledu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuctionHammer-V22-100-Matches
          path: reports/v22_100/
          if-no-files-found: warn
          retention-days: 90
